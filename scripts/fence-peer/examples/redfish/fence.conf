# Global settings for drbd-fence-peer.sh
#
# FENCE_ACTION: what to do to a peer that must be fenced.
#   reboot -> power-cycle (self-healing: peer reboots and rejoins as Secondary)
#   off    -> power off   (peer stays down until a human powers it on)
FENCE_ACTION="reboot"

# FENCE_DELAY: automatic priority-fencing-delay, in seconds. In a symmetric
# two-node partition both nodes try to fence each other; the node that is
# Primary (serving the data) fences immediately, the Secondary node waits this
# long so the live Primary can shoot it first, instead of both rebooting each
# other. Make it comfortably longer than one fence action takes to confirm.
# Set to 0 to disable (then both nodes fence immediately).
FENCE_DELAY=5

# Syslog tag used by the handler (journalctl -t drbd-fence-peer).
LOG_TAG="drbd-fence-peer"
