stages:
  - build
  - test

variables:
  BUILD_HELPERS_VERSION: 0fa86e05314b906db34862d95e81b598dc029fa1
  DRBD9_TESTS_REF: master
  # we have to change the way GitLab CI clones the repository.
  # by default, it is shallow, which gives us a wrong commit count when
  # we do `git rev-list --count origin/master` below.
  GIT_DEPTH: 0
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: normal

.setup-lbbuild:
  before_script:
    - . gitlab-utils.sh
    - ci_prepare_tools
    - ci_fetch_rq
    - ci_fetch_lbbuildctl
    - git clone --branch ${DRBD9_TESTS_REF} https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/drbd/drbd9-tests.git
    - |
      drbd_utils_build () {
        local version="$1"
        local release="$2"

        dummy-release.sh drbd-utils "$version" "$release" drbd.spec.in
        sed -i "s/^AC_INIT.*/AC_INIT(DRBD, $version, [drbd-dev@lists.linux.dev])/" configure.ac
        git config --global user.email "invalid@linbit"
        git config --global user.name "Dummy"
        git commit -am "CI $version - $release"
        ./autogen.sh
        ./configure --prefix=/usr --localstatedir=/var --sysconfdir=/etc --without-manual
        install /dev/null $(which lbvers.py)
        make debrelease VERSION="$version" FORCE=1
        local tarball
        tarball=$(ls drbd-utils-*.tar.gz)
        pulp file content upload --repository lbbuild-upstream \
          --file "$tarball" \
          --relative-path "$tarball"

        # Distributions, comma separated.
        # * "mainline" is excluded because the user space components are the same as the base distribution.
        # * rhelX.y is replaced by rhelX.0
        local dists=$(rq -t < drbd9-tests/virter/vms.toml | jq -r '[
          .vms[].metadata.BuildDistribution
          | values
          | select(. != "mainline")
          | sub("rhel(?<major>\\d+)\\.\\d+"; "rhel\(.major).0")
        ] | unique | join(",")')

        lbbuildctl build drbd-utils --arch amd64 --ci -v "$DRBD_UTILS_VERSION" \
          -d $dists
      }

# rules clause determining whether to build
.rules-build:
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == 'master'

build:
  stage: build
  extends: [ .rules-build, .setup-lbbuild ]
  image: $LINBIT_DOCKER_REGISTRY/build-helpers:$BUILD_HELPERS_VERSION
  cache:
    paths:
      - download
  script:
    # Other projects pin the master build as "9.0.0.latest-*", so that name
    # must stay. Merge request builds use 9.99.0.<sha> so that they sort above
    # every release: the packaging tests upgrade from the latest release to
    # the build under test, and version comparisons in the spec and control
    # files (Obsoletes, Breaks, ...) only mean something that way.
    - if [ "$CI_COMMIT_BRANCH" = master ]; then
    -   DRBD_UTILS_VERSION=9.0.0.latest
    -   DRBD_UTILS_RELEASE=$(git rev-list --count origin/master)
    - else
    -   DRBD_UTILS_VERSION=9.99.0.$CI_COMMIT_SHA
    -   DRBD_UTILS_RELEASE=1
    - fi
    - drbd_utils_build $DRBD_UTILS_VERSION $DRBD_UTILS_RELEASE

drbd-utils-tests:
  stage: test
  rules:
    - if: $CI_MERGE_REQUEST_ID
  image: fedora:42
  needs: []
  variables:
    CC: clang
    CFLAGS: -fsanitize=address -fsanitize=undefined
    LDFLAGS: -fsanitize=address -fsanitize=undefined
    # We ignore leaks for now, too many issues here
    ASAN_OPTIONS: log_path=sanitizer,log_exe_name=yes,log_suffix=.txt,detect_leaks=0
    UBSAN_OPTIONS: log_path=sanitizer,log_exe_name=yes,log_suffix=.txt
  before_script:
    - dnf install --setopt=install_weak_deps=False -y clang compiler-rt libubsan libasan keyutils-libs-devel flex git clitest automake gawk jq
  script:
    - ./autogen.sh
    - ./configure --without-manual
    - make test
  artifacts:
    when: always
    paths:
      - "**/sanitizer.*.txt"

# Common setup for jobs that run VMs with vmshed on the libvirt runners:
# drbd9-tests (VM definitions), build-helpers, rq, virter and vmshed.
.setup-vmshed:
  stage: test
  rules:
    - if: $CI_MERGE_REQUEST_ID
  tags:
    - libvirt
  needs:
    - build
  cache:
    paths:
      - download
  before_script:
    - git clone --branch ${DRBD9_TESTS_REF} https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/drbd/drbd9-tests.git
    - . drbd9-tests/virter/version.env
    - git init build-helpers -q -b unused
    - git -C build-helpers fetch -q --depth 1 $CI_SERVER_PROTOCOL://gitlab-ci-token:${CI_JOB_TOKEN}@$CI_SERVER_HOST:$CI_SERVER_PORT/linbit/build-helpers.git $BUILD_HELPERS_VERSION
    - git -C build-helpers checkout -q $BUILD_HELPERS_VERSION
    - . build-helpers/gitlab-utils.sh
    - |
      ci_prepare_tools
      ci_fetch_rq
      ci_fetch_binary virter virter-$VIRTER_VERSION https://github.com/LINBIT/virter/releases/download/$VIRTER_VERSION/virter-linux-amd64
      ci_fetch_binary vmshed vmshed-$VMSHED_VERSION https://github.com/LINBIT/vmshed/releases/download/$VMSHED_VERSION/vmshed-linux-amd64
  artifacts:
    # provide a convenient name so that the downloaded artifacts can be identified
    name: $CI_PROJECT_NAME-$CI_JOB_ID
    paths:
      - tests-out/
    when: always
    reports:
      junit: tests-out/test-results/*.xml

drbd-tests:
  extends: .setup-vmshed
  script:
    - export DRBD_TEST_DOCKER_IMAGE=$LINBIT_DOCKER_REGISTRY/drbd9-tests:latest
    - docker image pull $DRBD_TEST_DOCKER_IMAGE
    - |
      export DRBD_VERSION=9.2.0.latest
      export DRBD_UTILS_VERSION=9.99.0.$CI_COMMIT_SHA-1
      ./drbd9-tests/virter/run-test.sh

# Install the latest release, upgrade to the build under test, downgrade,
# remove and purge the packages on every distribution we build for.
# See tests/packaging/.
packaging-tests:
  extends: .setup-vmshed
  script:
    # The VM definitions come from drbd9-tests, the same source the build job
    # derives its distribution list from.
    - tests/packaging/gen-vms.sh drbd9-tests/virter/vms.toml > tests/packaging/vms.toml
    - cat tests/packaging/vms.toml
    - |
      vmshed \
        --quiet \
        --out-dir "$(readlink -f tests-out)" \
        --startvm 40 \
        --nvms "${LINBIT_CI_MAX_CPUS:-20}" \
        --vms tests/packaging/vms.toml \
        --tests tests/packaging/tests.toml \
        --pull-template "$LINBIT_DOCKER_REGISTRY/vm/drbd9-tests/{{ .Image }}:latest" \
        --set values.DrbdUtilsVersion=9.99.0.$CI_COMMIT_SHA-1

